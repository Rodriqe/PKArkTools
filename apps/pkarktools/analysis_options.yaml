include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
  exclude:
    - lib/**/*.g.dart
    - lib/l10n/app_localizations*.dart
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_super_parameters
